<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Retro - ruvyu</title>
    <!-- Importamos la fuente pixelada VT323 -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        /* 1. CONFIGURACIÓN DEL FONDO RETRO / LIMINAL */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-image: url('ef812e1b55b38f47f245e5c27fd95254.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            min-height: 100vh;
            transition: filter 0.3s ease;
            position: relative;
            overflow-x: hidden;
        }

        /* 0. PANTALLA DE INICIO WINDOWS 7 (BOOT SCREEN) */
        #win7-boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            transition: opacity 1s ease, visibility 1s ease;
        }

        #win7-boot-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* LOGO Y PUNTOS DE CARGA WINDOWS 7 */
        .win7-logo-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .win7-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            animation: win7Pulse 1.5s infinite ease-in-out;
        }

        .win7-dot:nth-child(1) { background-color: #f25022; animation-delay: 0s; }
        .win7-dot:nth-child(2) { background-color: #7fba00; animation-delay: 0.2s; }
        .win7-dot:nth-child(3) { background-color: #00a4ef; animation-delay: 0.4s; }
        .win7-dot:nth-child(4) { background-color: #ffb900; animation-delay: 0.6s; }

        @keyframes win7Pulse {
            0%, 100% { transform: scale(0.6); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 10px currentColor; }
        }

        .win7-text {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 22px;
            letter-spacing: 2px;
            color: #d0e0f0;
            text-shadow: 0 0 10px rgba(0, 164, 239, 0.8);
            margin-top: 10px;
            margin-bottom: 20px;
        }

        /* BOTONES DE LA PANTALLA DE CARGA */
        .boot-buttons-container {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            transition: opacity 0.3s ease;
        }

        .boot-btn {
            background: linear-gradient(180deg, #ffffff 0%, #d4ffcc 45%, #66ff33 50%, #99ff66 100%);
            color: #003300;
            border: 1px solid #39ff14;
            border-radius: 4px;
            padding: 8px 20px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 20px;
            font-weight: bold;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 0 10px rgba(57, 255, 20, 0.4);
            transition: all 0.2s ease;
        }

        .boot-btn:hover {
            background: linear-gradient(180deg, #ffffff 0%, #e6ffeb 45%, #88ff4d 50%, #b3ff80 100%);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.9);
            transform: translateY(-2px);
        }

        .boot-btn:active {
            transform: translateY(1px);
        }

        .boot-btn.no-music {
            background: linear-gradient(180deg, #ffffff 0%, #ffe6e6 45%, #ff6666 50%, #ff9999 100%);
            color: #400000;
            border-color: #ff3333;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 0 10px rgba(255, 51, 51, 0.4);
        }

        .boot-btn.no-music:hover {
            background: linear-gradient(180deg, #ffffff 0%, #fff0f0 45%, #ff8080 50%, #ffb3b3 100%);
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.9);
        }

        /* BARRA DE CARGA LENTA RETRO */
        .loading-bar-container {
            display: none;
            width: 280px;
            height: 18px;
            background: #051405;
            border: 2px solid #39ff14;
            border-radius: 4px;
            padding: 2px;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
            margin-top: 15px;
        }

        .loading-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #39ff14, #7fff00);
            box-shadow: 0 0 8px #39ff14;
            transition: width 0.1s linear;
        }

        .loading-status-text {
            display: none;
            font-family: 'VT323', monospace;
            font-size: 18px;
            color: #39ff14;
            margin-top: 10px;
            text-shadow: 0 0 5px #39ff14;
        }

        /* --- CONTENEDORES Y ESTILOS DE LAS BURBUJAS LATERALES --- */
        .bubbles-container {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 180px;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        .bubbles-container.left { left: 0; }
        .bubbles-container.right { right: 0; }

        .bubble {
            position: absolute;
            bottom: -80px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.9) 0%, rgba(127, 255, 0, 0.4) 45%, rgba(57, 255, 20, 0.1) 70%, rgba(255, 255, 255, 0.6) 100%);
            box-shadow: inset -2px -2px 6px rgba(0, 50, 0, 0.4), inset 2px 2px 8px rgba(255, 255, 255, 0.8), 0 0 12px rgba(57, 255, 20, 0.5);
            backdrop-filter: blur(1px);
            animation: rise 8s infinite ease-in;
        }

        @keyframes rise {
            0% {
                transform: translateY(0) scale(0.8) translateX(0);
                opacity: 0;
            }
            15% {
                opacity: 0.85;
            }
            50% {
                transform: translateY(-50vh) scale(1) translateX(15px);
            }
            85% {
                opacity: 0.85;
            }
            100% {
                transform: translateY(-110vh) scale(1.1) translateX(-10px);
                opacity: 0;
            }
        }

        /* Variaciones de tamaño, velocidad y posición de las burbujas */
        .b1 { width: 45px; height: 45px; left: 20%; animation-duration: 7s; animation-delay: 0s; }
        .b2 { width: 25px; height: 25px; left: 60%; animation-duration: 5s; animation-delay: 1.5s; }
        .b3 { width: 65px; height: 65px; left: 35%; animation-duration: 9s; animation-delay: 3s; }
        .b4 { width: 30px; height: 30px; left: 75%; animation-duration: 6s; animation-delay: 4.5s; }
        .b5 { width: 50px; height: 50px; left: 10%; animation-duration: 8s; animation-delay: 2s; }
        .b6 { width: 20px; height: 20px; left: 50%; animation-duration: 5.5s; animation-delay: 6s; }

        /* CAPA 1: EFECTO OJO DE PEZ / LENTE CRT */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, transparent 60%, rgba(0, 0, 0, 0.75) 90%, rgba(0, 0, 0, 0.95) 100%);
            pointer-events: none;
            z-index: 9990;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8);
        }

        /* Efecto de desenfoque cuando el lightbox está activo */
        body.modal-open > *:not(#lightbox-modal):not(#win7-boot-screen) {
            filter: blur(8px);
            pointer-events: none;
        }

        /* Aplicamos la fuente pixelada de forma global */
        .window, .title-bar, .btn-retro, p, h1, a, .video-title {
            font-family: 'VT323', monospace;
        }

        /* ANIMACIÓN DE FLOTADO DE LAS VENTANAS */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        /* ANIMACIÓN DE CARGA RETRO / DESPLEGADO LENTO DE VENTANAS */
        @keyframes windowRender {
            0% {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0px);
                filter: blur(0px);
            }
        }

        /* 2. ESTILO DE LAS VENTANAS - VERDE FOSFORESCENTE AERO GLASS */
        .window {
            background: rgba(57, 255, 20, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: 100%;
            max-width: 800px;
            border: 1px solid rgba(127, 255, 0, 0.8);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 15px rgba(57, 255, 20, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            padding: 5px;
            margin-bottom: 10px;
            position: relative;
            z-index: 10;
            
            /* Estado inicial oculto para simular carga lenta */
            opacity: 0;
        }

        /* Clase activada secuencialmente desde JS para renderizar lenta y progresivamente */
        .window.loaded {
            animation: windowRender 0.8s ease-out forwards, float 4s ease-in-out infinite 0.8s;
        }

        /* BARRA DE TÍTULO VERDE FOSFORESCENTE */
        .title-bar {
            background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(127,255,0,0.5) 50%, rgba(57,255,20,0.7) 51%, rgba(57,255,20,0.9) 100%);
            color: #000000;
            text-shadow: 0 0 5px rgba(57, 255, 20, 0.8), 0 1px 0 #ffffff;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 22px;
            letter-spacing: 1px;
            border-radius: 6px 6px 0 0;
            border-bottom: 1px solid rgba(0, 50, 0, 0.5);
        }

        /* BOTÓN DE CERRAR WINDOWS 7 EN ROJO RETRO */
        .title-bar-controls button {
            background: linear-gradient(180deg, #e59895 0%, #c4433c 50%, #ab2821 51%, #d14841 100%);
            border: 1px solid #73120c;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 1px 2px rgba(0,0,0,0.3);
            color: white;
            width: 24px;
            height: 18px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-shadow: 0 -1px 0 rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        .title-bar-controls button:hover {
            background: linear-gradient(180deg, #f0a8a5 0%, #d9534c 50%, #c2332c 51%, #e25851 100%);
            box-shadow: 0 0 8px rgba(220, 60, 50, 0.8);
        }

        /* CUERPO DE LA VENTANA */
        .window-body {
            background-color: rgba(5, 20, 5, 0.92);
            border: 1px solid rgba(57, 255, 20, 0.4);
            border-radius: 4px;
            margin: 4px;
            padding: 20px;
            color: #ffffff;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.9);
        }

        /* 3. CONTENEDOR PARA TU AVATAR IMAGEN */
        .profile-card {
            flex: 1;
            min-width: 200px;
            border: 1px solid rgba(57, 255, 20, 0.6
